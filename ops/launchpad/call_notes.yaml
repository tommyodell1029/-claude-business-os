    pain: "Are you still building up the business, or have you been at it a while?"
    why_it_matters: "Possibly newer and price-sensitive. Mention the payment split (half to start)."
  - name: "Hoffman Plumbing Inc"
    order: 13
    facts:
      - "4.0 stars from 2 Google reviews, Farm Way, Middleburg; no hours listed (Google Business listing)"
    hook: "I noticed Hoffman Plumbing doesn't have a website on its Google listing."
    pain: "Do you get most of your work from contractors and builders, or from homeowners?"
    why_it_matters: "Only 2 reviews: maybe commercial or new-construction focused, so a homeowner site may matter less. Ask before pitching."
  - name: "Aldridge & Sons Plumbing"
    order: 14
    phone: "+19042873855"
    facts:
      - "Website aldridgesonsplumbing.com: 'family owned and operated', 'State Certified, licensed & insured', phone (904) 287-3855 (their homepage)"
      - "On a phone the number isn't tappable, and there's no request form or main headline on the homepage (browser check 2026-10-14)"
    hook: "I was on your website, the family-owned, state-certified part really comes through, and I noticed on my phone that the number isn't tap-to-call and there's no way to send a request."
    pain: "Do most people call you, or do you get emails through the site?"
    why_it_matters: "This is a redesign of an existing site. Offer to rebuild the homepage as one fast page."
  - name: "Prime AC Repair Service"
    order: 15
    facts:
      - "Listed in Orange Park, open 24/7, no reviews, but the phone number has a Michigan area code, (269) 354-7490 (Google Business listing)"
    hook: "I noticed Prime AC Repair doesn't have a website on its Google listing."
    pain: "Are you based here in Orange Park?"
    why_it_matters: "A Michigan number plus no reviews can mean a lead-reseller listing, not a local company. If it's a call center or they won't say who does the work, thank them, hang up and mark the lead lost."
