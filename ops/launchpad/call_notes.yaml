# Personal notes for the Saturday call scripts (2026-10-18). Every fact has a source; nothing here is guessed.
# "hook" = what you noticed, "pain" = the question that opens their real problem. Ask, never tell them their business.
leads:
  - name: "ROOTER EXPRESS OF JAX LLC"
    order: 1
    facts:
      - "5.0 stars from 173 Google reviews, listed as open 24 hours (Google Business listing)"
      - "Also on HomeAdvisor (4.64, 95 reviews) and Thumbtack, which lists about 4 years in business and 1 employee (homeadvisor.com, thumbtack.com)"
    hook: "You've got 173 five-star reviews on Google, which is more than most of the big companies in town, but when someone taps 'Website' on your listing there's nothing there."
    pain: "Are you still getting a good chunk of your work through HomeAdvisor or Thumbtack, or is it mostly people finding you on Google?"
    why_it_matters: "Lead sites charge per lead. A site of his own turns his 173 Google reviews into direct calls. Don't claim his costs. Let him say it."
  - name: "Precision Plumbing"
    order: 2
    facts:
      - "5.0 stars from 75 Google reviews, open 24 hours, 3718 Emerson St (Google Business listing)"
      - "The website on the Google listing, precisionplumbingflorida.com, has expired. It now shows 'Buy this expired domain' for $195 (checked in a browser 2026-10-14)"
    hook: "I was looking at Jacksonville plumbers and you've got a perfect 5.0 from 75 reviews. But heads up: the website link on your Google listing goes to a page selling your old domain name for $195."
    pain: "Did you know that link was dead? Anybody who taps it from Google lands on a 'buy this domain' page."
    why_it_matters: "This is a real, urgent problem, and you're helping him by telling him. Lead with the help, not the sale."
  - name: "Able Plumbing Repair Service, Inc."
    order: 3
    facts:
      - "4.2 stars from 90 Google reviews, listed as open 24 hours, 170 College Dr, Orange Park (Google Business listing)"
      - "A directory page has reviews praising fast emergency response and mentions plumbers named Greg and John (bestprosintown.com; third-party, so treat as unconfirmed)"
    hook: "You're open 24 hours with 90 reviews, but there's no website on your Google listing."
    pain: "When somebody's got water on the floor at midnight, are most of your calls coming straight from Google, or from people who already know you?"
    why_it_matters: "Night-time emergency searchers compare 2–3 listings fast. A page with services, a tap-to-call button and a service area helps them pick him."
  - name: "Harry H Hill Plumbing Inc"
    order: 4
    facts:
      - "5.0 stars from 86 Google reviews, 12 Widener Way, Orange Park; listed open 24 hours Mon–Fri, closed Sat–Sun (Google Business listing)"
      - "No other web presence found in a search (2026-10-14): the Google listing is basically their whole online footprint"
    hook: "A perfect 5.0 from 86 reviews is really strong, and from what I can see the Google listing is the only place online people can find you."
    pain: "When people find you on Google, do they usually just call, or do you ever hear 'I couldn't find much about you online'?"
    why_it_matters: "Closed on weekends. A request form catches weekend jobs so he can call them back Monday, before they call someone else."
  - name: "Stevenson plumbing"
    order: 5
    facts:
      - "5.0 stars from 38 Google reviews, listed open 24 hours (Google Business listing)"
      - "Only a generic directory profile found online (lantern.llc), no website"
    hook: "You've got a perfect 5.0 on Google, and you're listed as open 24 hours, but there's no website on the listing."
    pain: "Is it mostly you running the calls yourself? How do people find you when they're not a referral?"
    why_it_matters: "Small or solo operator. Keep it short and respect his time."
  - name: "Rolland Reash Plumbing"
    order: 6
    facts:
      - "4.7 stars from 665 Google reviews, open 24 hours (Google Business listing)"
      - "Website plumbingjacksonville.com says 25+ years in Jacksonville. The number at the top (904.260.7059) is plain text, not tappable, and there's no request form on the homepage (browser check 2026-10-14)"
    hook: "You've got 665 reviews and 25 years in Jacksonville, which is a serious reputation. I was looking at your site on my phone and noticed the phone number at the top isn't tappable."
    pain: "Do you have someone who manages the website for you, or is that something you handle?"
    why_it_matters: "Big established company: likely has a web person already. The goal is a referral to whoever manages it, or a quick-fix quote. Lowest chance of the $499 sale. Keep it light."
  - name: "Black Pearl Plumbing"
    order: 7
    facts:
      - "4.1 stars from 28 Google reviews, 2487 County Rd 220, Middleburg; open Mon–Fri 8–5, closed weekends (Google Business listing)"
    hook: "I noticed Black Pearl doesn't have a website on its Google listing, and you're closed on weekends."
    pain: "When somebody's toilet overflows on a Saturday, what happens? Do they just call the next plumber on the list?"
    why_it_matters: "The form catches weekend requests for Monday follow-up."
  - name: "Gunderson Plumbing Co"
    order: 8
