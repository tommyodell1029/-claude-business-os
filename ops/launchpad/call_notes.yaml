    pain: "Do most of your jobs come from Green Cove and Clay County word of mouth, or are you trying to reach more people up toward Orange Park and Fleming Island?"
    why_it_matters: "Weekday-only hours. A form catches after-hours requests."
  - name: "Gator Plumbing of Orange Park"
    order: 11
    facts:
      - "3.3 stars from 13 Google reviews, 99 Industrial Loop Dr N, Orange Park; no hours listed (Google Business listing)"
    hook: "I noticed Gator Plumbing doesn't have a website on its Google listing, and your hours aren't listed either."
    pain: "Right now the Google listing is all people see. Would it help to have a page where you can show your services and tell people who you are in your own words?"
    why_it_matters: "Never mention the 3.3 rating unless he does. If he brings it up, a site lets him present his work, but it doesn't change reviews."
  - name: "Budget Plumbing"
    order: 12
