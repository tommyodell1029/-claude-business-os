# Client intake answers. Copy to data/intake/<slug>.yaml (data/ is gitignored; it holds owner contact details, never commit it), fill in, then:
#   uv run python scripts/new_client.py data/intake/<slug>.yaml --dry-run
# Keys match clients/<slug>.yaml. Everything the caller will hear must come from the owner. Never invent it.
business_name: "Example Plumbing Co"
slug: example-plumbing          # optional; derived from business_name if omitted
industry: home_services
timezone: America/New_York
twilio_number: "+19045550100"   # the number bought for this client
owner_phone: "+19045550101"     # where urgent calls and (later) SMS go
owner_email: owner@example.com  # where call alerts are emailed
handoff_number: "+19045550101"  # who the agent transfers emergencies to
hours:                          # "HH:MM-HH:MM" (24h) or closed
  mon: "08:00-17:00"
  tue: "08:00-17:00"
  wed: "08:00-17:00"
  thu: "08:00-17:00"
  fri: "08:00-17:00"
  sat: closed
  sun: closed
services:
  - Drain cleaning
service_area:
  - Jacksonville
faqs:
  - q: Do you charge for estimates?
    a: The owner's real answer goes here.
booking_type: take_message      # take_message | request_time
emergency_keywords: [flooding, burst pipe, gas smell]
greeting: "How can I help you today?"
# Optional: tts {provider, voice_id, speed}, languages [en, es] + greeting_es, max_call_minutes, silence_timeout_secs.
# Omitted values default to the demo agent's voice and limits.
