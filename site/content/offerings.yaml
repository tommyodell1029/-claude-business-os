# What LaunchPad Local sells. APPROVED by owner 2026-10-01 (see docs/PRICING_PROPOSAL.md for rationale + sources).
# Site, proposals and sales skills read prices from here. Never quote a price that is not in this file.
# Only items with available: true may be offered or shown as purchasable.

currency: USD

# ---------------------------------------------------------------- receptionist tiers
# Founding pricing applies to the first 5 paying receptionist clients; from client #6 the standard pricing applies.
pricing_phase:
  founding_client_limit: 5
  founding_clients_signed: 0      # update when each founding client pays setup

tiers:
  launch:
    name: Launch
    included_minutes: 300
    overage_per_min: 0.25
    features: [answering_24_7, faqs, messages, text_email_summaries, emergency_transfer]
    locations: 1
    founding: { setup: 497, monthly: 297 }
    standard: { setup: 497, monthly: 497 }
  growth:
    name: Growth
    included_minutes: 800
    overage_per_min: 0.25
    features: [answering_24_7, faqs, messages, text_email_summaries, emergency_transfer, appointment_time_requests, monthly_report_tuning]
    locations: 1
    founding: { setup: 497, monthly: 497 }
    standard: { setup: 497, monthly: 797 }
  scale:
    name: Scale
    included_minutes: 2000
    overage_per_min: 0.20
    features: [answering_24_7, faqs, messages, text_email_summaries, emergency_transfer, appointment_time_requests, monthly_report_tuning, bilingual_es]
    locations: 3
    founding: { setup: 997, monthly: 997 }
    standard: { setup: 997, monthly: 1497 }

# Founding clients: setup fee is charged in full (not waived). The first month after purchase is free;
# recurring billing starts on the 1st of the SECOND calendar month after the setup payment.
# Example: setup paid Sept 1 (or any day in September) -> no charge in October -> first monthly charge Nov 1.
# Code: lp.billing.first_recurring_charge(setup_date). Standard clients: recurring starts 1 month after setup.
founding_offer:
  setup_waived: false
  free_months: 1
  recurring_starts: first_of_second_month_after_setup
# Owner-approved 2026-10-01.
terms:
  contract: month-to-month
  trial: none                     # no trial; founding clients get the month after setup free (see founding_offer)
  refunds: "All sales are final. No refunds on setup fees or monthly fees, including partial months."
  cancellation: "Cancel anytime by emailing {cancellation_email}. Cancellation stops future billing; service continues until the end of the period already paid."
  cancellation_email: "tommy@launchpadlocal.org"   # owner-confirmed 2026-10-01 (LaunchPad Workspace inbox)
  retention: .claude/skills/client-cancellation/SKILL.md

# ---------------------------------------------------------------- services
services:
  voice_receptionist:
    name: AI Phone Receptionist
    summary: Inbound AI receptionist that answers calls 24/7, answers FAQs from approved info, takes messages or appointment requests, transfers emergencies, and texts and emails the owner a summary.
    available: true
  website:
    name: Websites for Local Businesses
    summary: Fast, mobile-first marketing website with a contact form and click-to-call, built and hosted for the client.
    price: { build: 1497, build_with_growth_or_scale: 997, hosting_maintenance_monthly: 49 }
    available: false            # DROPPED by owner 2026-10-08; replaced by website_starter below (2026-10-13)
  # Owner 2026-10-13 (ULTRON business launch): the first offer to validate. Price and niche are test hypotheses.
  website_starter:
    name: One-Page Business Website
    summary: A professional, mobile-friendly one-page website for a local service business, with click-to-call, a working contact form and basic on-page SEO.
    price: { build: 499, maintenance_monthly: 49 }
    available: true
    target_niches: [plumbing, hvac]
    includes:
      - Mobile-responsive design
      - Clear service descriptions
      - Click-to-call buttons
      - Contact form that emails you (delivery tested before launch)
      - Basic on-page SEO (title, description, headings, local business details)
      - One revision round
      - Deployment help (on your domain or ours)
      - A short handoff guide
    delivery: "3-5 business days after we receive your content, photos, approvals and access"
    payment: "50% deposit before work starts; the remaining 50% before launch or handoff"
    # Website refund policy: APPROVED by owner 2026-10-14 (live on /terms).
    refunds: "If you cancel before we start work, we refund your deposit in full. Once work has started, the deposit is not refundable. The remaining balance is only due once you approve the finished site."
    revisions_extra: "Changes beyond the one included revision round are quoted before we do them."
    excludes:
      - Logo or brand design
      - Copywriting beyond the one page (we draft from your details; you approve)
      - Professional photography or paid stock photos
      - Online booking, payments, e-commerce or customer logins
      - Ongoing changes after launch (that's the maintenance plan)
      - Domain registration fees and third-party subscriptions
      - Guaranteed rankings, traffic, leads or revenue
    maintenance:
      name: Website Care Plan
      price_monthly: 49
      includes:
        - Hosting on our account
        - Up to 30 minutes of small text or photo updates a month
        - Contact form check each month
        - Fixes if something we built breaks
      excludes:
        - New pages or redesigns (quoted separately)
      terms: "Month-to-month. Cancel anytime by email."

