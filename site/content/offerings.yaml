    price: { monthly: 99 }
    available: true             # one client YAML per number
  bilingual_es:
    name: Spanish/English receptionist
    price: { monthly: 99 }      # included in Scale
    available: true             # built 2026-10-01 (languages: [en, es]); first real Spanish phone call still to verify
  monthly_report:
    name: Monthly call report and tuning (Launch tier)
    price: { monthly: 49 }      # included in Growth and Scale
    available: false            # after weekly audit job (T8)
  calendar_booking:
    name: Calendar booking integration
    price: { setup: 199, monthly: 49 }
    available: false            # not built
  chat_widget:
    name: Website chat widget (same approved FAQs)
    price: { monthly: 79 }
    available: false            # not built
  missed_call_textback:
    name: Missed-call text-back
    price: { monthly: 49 }      # plus carrier registration pass-through
    available: false            # needs A2P 10DLC + caller consent (decision C2)
